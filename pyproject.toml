[project]
name = "apache-iceberg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mkranjcev", email = "kranjcev@srce.hr" }
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.43.115",
    "botocore>=1.43.115",
    "dotenv>=0.9.9",
    "duckdb>=1.5.6",
    "jq>=1.12.0",
    "jsonschema>=4.26.0",
    "pyarrow>=25.0.1",
    "pyiceberg>=0.12.0",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.marimo.runtime]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "marimo>=0.25.2",
    "ruff>=0.17.1",
]
